services:
  react_frontend:
    build:
      context: ./trader/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./trader/frontend:/app
      - /app/node_modules 
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - app-network     

  listener:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/trader
    command: python -m engine.listener
    depends_on:
      react_frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f engine.listener || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 5
    networks:
      - app-network     

  paper_trader:
    build: .
    env_file:           
      - ./trader/.env   
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/trader
    command: python -m engine.paper_trader
    depends_on:
      listener:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks:
      - app-network     
  
  api:
    build:
      context: ./trader/backend
      dockerfile: Dockerfile
    env_file:
      - ./trader/.env
    ports:
      - "8000:8000"
    volumes:
      - ./trader/backend:/app/trader/backend
      - ./trader/data:/app/trader/data
      - lstm_data:/app/trader/lstm
    working_dir: /app/trader/backend
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    networks:
      - app-network     
  
  lstm_predictor:
    build:
      context: ./trader/lstm
      dockerfile: Dockerfile
    volumes:
      - ./trader/lstm:/app
      - lstm_data:/app/trader/lstm
    environment:
      - PYTHONPATH=/app
    command: python lstm.py --quiet
    stdin_open: true
    tty: true
    networks:
      - app-network     

volumes:
  lstm_data:
    driver: local

networks:
  app-network:
    driver: bridge